# XDK 4134 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Jet Set Radio Future, PAL, title 49470018) code at the address given. A key left out is unknown and
# traps where the runtime first needs it.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at (0x19BCC0, Direct3D_CreateDevice 0x18EF60)
CDevice_Push              = 0x0    # D3DDevice_SetTexture 0x18EA22 reads it, compares with +4
CDevice_PushThreshold     = 0x4    # D3DDevice_SetTexture 0x18EA24 compares the push pointer with it
CDevice_BaseVertex        = 0x1C   # D3DDevice_SetIndices 0x18EBA9 stores BaseVertexIndex
CDevice_IndexBuffer       = 0x38C  # D3DDevice_SetIndices 0x18EB7A reads the old one, 0x18EBA2 stores the new one
CDevice_ZScale            = 0x44C  # D3D_UpdateProjectionViewportTransform 0x18F4F6 scales the Z range by it
CDevice_SuperSampleX      = 0x454  # D3D_UpdateProjectionViewportTransform 0x18F4A6 scales viewport width by it
CDevice_SuperSampleY      = 0x458  # D3D_UpdateProjectionViewportTransform 0x18F4CC scales viewport height by it
CDevice_Transforms        = 0x750  # D3DDevice_SetTransform 0x18D736 copies 16 dwords to +0x750 + type * 64
CDevice_Textures          = 0xA78  # D3DDevice_SetTexture 0x18E9E0 reads, 0x18EA19 stores [stage]
CDevice_Palettes          = 0xA88  # 0x193104 walks the four palettes after the four textures
CDevice_RenderTarget      = 0x2070 # D3DDevice_SetRenderTarget 0x18DBC6 reads the old one
CDevice_Depth             = 0x2074 # D3DDevice_GetDepthStencilSurface 0x18E535 returns it
CDevice_BackBuffer        = 0x207C # D3DDevice_GetBackBuffer 0x18E0FD returns it for index 0
CDevice_FrontBuffer       = 0x2080 # D3DDevice_GetBackBuffer 0x18E0FD returns it for index -1
CDevice_Size              = 0x2AE0 # D3DDevice_Release 0x18D8CB clears 0xAB8 dwords of the device
CDevice_SwapCount         = 0x2ABC # D3DDevice_Swap 0x199A16 increments it, 0x199A30 returns it
CDevice_Flags             = 0x8    # D3DDevice_Swap 0x1999E5 reads it
CDevice_Time              = 0x30   # D3D_SetFence 0x191E6D pushes it
CDevice_PixelShader       = 0x370  # D3DDevice_SetPixelShader 0x19A6B4 stores the handle
CDevice_VertexShader      = 0x380  # D3DDevice_SelectVertexShader 0x190C99, D3DDevice_SetVertexShader 0x190F61
CDevice_BackBufferScale   = 0x464  # D3DDevice_SetRenderTarget 0x18DC07 reads the X scale, 0x18DC01 the Y scale at +4
CDevice_Viewport          = 0x9D0  # D3D_UpdateProjectionViewportTransform 0x18F48F to 0x18F4EA reads Width, Height, MinZ, MaxZ at +8..+0x14
CDevice_ScreenSpaceOffset = 0x9E8  # D3DDevice_SetScreenSpaceOffset 0x18EE93 stores x, 0x18EEA3 y at +4
CDevice_AutoDepth         = 0x2088 # D3D_InitDefaultState 0x1924D8 reads the auto depth buffer, enables Z when there is one
CDevice_VBlankCallback    = 0x242C # 0x18D8FA stores it (XbSymbolDatabase m_VBlankCallback_OFFSET)
CDevice_VBlankEvent       = 0x2430 # D3DDevice_BlockUntilVerticalBlank 0x18D91B clears its SignalState at +4
CDevice_GammaRamps        = 0x247C # D3DDevice_SetGammaRamp 0x18D640 copies to +0x2268 + 0x214 + index * 0x300
CDevice_GammaPending      = 0x2A7C # D3DDevice_SetGammaRamp 0x18D656 sets [+0x2268 + 0x814 + index * 4]
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x18EA55 ors it into D3D__DirtyFlags
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x18FD4B: [stage * 32 + type] dwords
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x190BAA indexes the stream table by n * 12
Stream_Stride             = 0x0    # D3DDevice_SetStreamSource 0x190BF2 stores Stride
Stream_Buffer             = 0x8    # D3DDevice_SetStreamSource 0x190BF8 stores the vertex buffer
# XAPI XPP device type record
XPP_Current               = 0x0    # XGetDevices 0x1BE0CA returns it
XPP_Changed               = 0x4    # XGetDevices 0x1BE0CC clears it, XGetDeviceChanges 0x1BE0EA tests it
XPP_Previous              = 0x8    # XGetDevices 0x1BE0D2 copies Current into it
# DSOUND
EffectsImage_Skip0         = 0x804 # 0x1A2242 (reached from CDirectSound_DownloadEffectsImage 0x19F197) adds this dword count
EffectsImage_Skip1         = 0x80C # 0x1A223C loads this dword count
EffectsImage_Desc          = 0x818 # 0x1A224B: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# D3DRS numbering of this XDK: 146 states, the simple ones end at 82 (D3DDevice_SetRenderStateNotInline 0x18F425
# compares with 0x52); the runtime translates to the 4831/5849 numbering it keeps
D3DRS_Numbering            = 4134
# memory
ContiguousLimit            = 0x4000000 # D3DResource_Register 0x1934BD and the texture creation mask physical addresses with 0x3FFFFFF (retail 64 MB)
