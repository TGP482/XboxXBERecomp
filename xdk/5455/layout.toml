# XDK 5455 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Medal of Honor: Rising Sun) code at the address given; moh3rdc.xbe (same 5455 libraries) shares the library code.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at; its miniport is at +0x1808 (D3DDevice_SetGammaRamp 0x1BB7F3)
CDevice_Push              = 0x0    # D3DDevice_SetTexture 0x1BC602 reads it, compares with +4, calls MakeSpace 0x1C1750
CDevice_PushThreshold     = 0x4    # D3DDevice_SetTexture 0x1BC605 compares the push pointer with it
CDevice_BaseVertex        = 0x1C   # D3DDevice_SetIndices 0x1BC849 stores BaseVertexIndex
CDevice_IndexBuffer       = 0x388  # D3DDevice_SetIndices 0x1BC81A reads the old one, 0x1BC842 stores the new one
CDevice_ZScale            = 0x530  # D3DDevice_GetViewportOffsetAndScale 0x1BD404 scales the Z range by it
CDevice_SuperSampleX      = 0x544  # D3DDevice_GetViewportOffsetAndScale 0x1BD35E scales viewport X by it
CDevice_SuperSampleY      = 0x548  # D3DDevice_GetViewportOffsetAndScale 0x1BD380 scales viewport Y by it
CDevice_Transforms        = 0x840  # D3DDevice_SetTransform 0x1BB8B1 copies 16 dwords to +(type + 0x21) * 64
CDevice_Textures          = 0xB68  # D3DDevice_SetTexture 0x1BC5C0 reads, 0x1BC5F9 stores [stage]
CDevice_Palettes          = 0xB78  # D3DDevice_SetPalette 0x1BC76D reads, 0x1BC7A5 stores [stage]
CDevice_RenderTarget      = 0x15E4 # D3DDevice_SetRenderTarget 0x1BBD77 reads the old one, 0x1BBDB6 stores the new one
CDevice_Depth             = 0x15E8 # D3DDevice_GetDepthStencilSurface2 0x1BC366 returns it; D3DDevice_SetRenderTarget 0x1BBDDF stores it
CDevice_BackBuffer        = 0x15F4 # D3DDevice_GetBackBuffer2 0x1BC010 returns it for index 0
CDevice_FrontBuffer       = 0x15F8 # D3DDevice_GetBackBuffer2 0x1BBFF5 returns it for index -1
CDevice_SwapCount         = 0x2058 # D3DDevice_Swap 0x1BF440 and 0x1BF480 increment it, 0x1BF4BB returns it
CDevice_Size              = 0x2080 # Direct3D_CreateDevice 0x1BD24B clears 0x820 dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x1BD206 to 0x1BD223 ors BehaviorFlags & 0x10 into it, D3DDevice_SetPixelShader 0x1C0AD1 tests that bit
CDevice_Time              = 0x2C   # D3D_KickOffAndWaitForIdle 0x1C17B5 passes it to D3D_BlockOnTime, D3D_SetFence 0x1C146A adds 2
CDevice_PixelShader       = 0x36C  # D3DDevice_SetPixelShader 0x1C0A08 stores the handle
CDevice_VertexShader      = 0x37C  # the device init 0x1C3D57 stores the FVF shader object 0x1CEB28, D3DDevice_SetVertexShader 0x1C089E the current one
CDevice_BackBufferScale   = 0x554  # the frame buffer init 0x1C349B stores the X scale as a float, 0x1C34B4 the Y scale at +4; D3DDevice_SetBackBufferScale 0x1BF5BA, 0x1BF5C4
CDevice_Viewport          = 0xAC0  # D3DDevice_SetViewport 0x1BC530 to 0x1BC55C stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xAD8  # D3DDevice_SetScreenSpaceOffset 0x1BCF23 stores x + 0.53125, 0x1BCF33 y + 0.53125 at +4
CDevice_AutoDepth         = 0x1600 # the frame buffer init 0x1C359A stores the depth buffer, D3D_InitDefaultState 0x1C3227 reads it
CDevice_VBlankCallback    = 0x1998 # D3DDevice_SetVerticalBlankCallback 0x1BBA5A stores it, the vertical blank handler 0x1C502E loads [miniport + 0x190] and calls it at 0x1C5055
CDevice_VBlankEvent       = 0x199C # D3DDevice_BlockUntilVerticalBlank 0x1BBAA7 waits on it, 0x1BBA9B clears its SignalState
CDevice_DisplayFlags      = 0x19BC # the mode set 0x1C4BBF stores the mode entry at miniport + 0x1B4, the vertical blank handler 0x1C4FCD tests it; MOHRS links no display mode getter
CDevice_VBlankCount       = 0x19C8 # the vertical blank handler 0x1C4F84 to 0x1C4F91 increments miniport + 0x1C0; 0x1BEB07 reads it
CDevice_Field             = 0x19D8 # the vertical blank handler 0x1C4FF4 and 0x1C5003 store the field at miniport + 0x1D0
CDevice_GammaRamps        = 0x19E4 # D3DDevice_SetGammaRamp 0x1BB823 copies to miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x1FE4 # D3DDevice_SetGammaRamp 0x1BB851 sets [miniport + 0x7DC + index * 4]
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x1BC637 ors it into D3D__DirtyFlags
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x1BDD3B: [stage * 32 + type] dwords
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x1C042A indexes the stream table by n * 12
Stream_Stride             = 0x0    # D3DDevice_SetStreamSource 0x1C0472 stores Stride
Stream_Buffer             = 0x8    # D3DDevice_SetStreamSource 0x1C0478 stores the vertex buffer
PixelShader_Definition    = 0x8    # D3DDevice_CreatePixelShader 0x1C09A4 stores the definition pointer, D3DDevice_SetPixelShader 0x1C0A70 reads it
# DSOUND. CDirectSoundStream_Vtable and _Vtable2 are left out: MOHRS links no DirectSound streams.
EffectsImage_Skip0        = 0x804  # 0x1D0FDB (CDirectSound_DownloadEffectsImage 0x1CF047 > 0x1CEEE2 > 0x1D122F > 0x1D0FC2) adds this dword count
EffectsImage_Skip1        = 0x80C  # 0x1D0FD5 loads this dword count
EffectsImage_Desc         = 0x818  # 0x1D0FE4: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current               = 0x0    # XGetDevices 0x1D9208 reads it, 0x1D9219 returns it
XPP_Changed               = 0x4    # XGetDevices 0x1D920A clears it, XGetDeviceChanges 0x1D9228 tests it
XPP_Previous              = 0x8    # XGetDevices 0x1D9210 copies Current into it
