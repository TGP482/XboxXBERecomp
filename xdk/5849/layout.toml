# XDK 5849 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Splinter Cell Double Agent) code at the address given; sc4_adv.xbe (same 5849 libraries) matches.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x49B112 reads it, compares with +4, calls MakeSpace 0x4A1740
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x49B115 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x49B2C9 stores BaseVertexIndex
CDevice_IndexBuffer   = 0x7A0   # D3DDevice_SetIndices 0x49B29A reads the old one, 0x49B2C2 stores the new one
CDevice_ZScale        = 0x948   # D3DDevice_GetViewportOffsetAndScale 0x49F114 scales the Z range by it
CDevice_SuperSampleX  = 0x95C   # D3DDevice_GetViewportOffsetAndScale 0x49F06E scales viewport X by it
CDevice_SuperSampleY  = 0x960   # D3DDevice_GetViewportOffsetAndScale 0x49F090 scales viewport Y by it
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform 0x49A476 copies 16 dwords to +0xC60 + type * 64
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture 0x49B0D0 reads, 0x49B109 stores [stage]
CDevice_Palettes      = 0xF98   # 0x49BA04 reads [stage] (state query 0x49B980), the device teardown 0x4A278F releases them; D3DDevice_SetPalette (Black 0x26B573) stores [stage]
CDevice_RenderTarget  = 0x1A04  # D3DDevice_GetRenderTarget2 0x49AE56 returns it
CDevice_Depth         = 0x1A08  # D3DDevice_GetDepthStencilSurface2 0x49AE76 returns it
CDevice_BackBuffer    = 0x1A14  # D3DDevice_GetBackBuffer2 0x49AB00 returns it for index 0
CDevice_FrontBuffer   = 0x1A18  # D3DDevice_GetBackBuffer2 0x49AAE5 returns it for index -1
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap 0x49CCB0 increments it, 0x49CD29 returns it
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice 0x49D28B clears 0x928 dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x49D263 ors BehaviorFlags & 0x10 into it (0x4AB678), D3DDevice_SetPixelShader 0x4A5DB1 tests that bit
CDevice_Time              = 0x2C   # D3D_KickOffAndWaitForIdle 0x4A17A5 passes it to D3D_BlockOnTime, D3D_SetFence 0x4A1475 adds 2
CDevice_PixelShader       = 0x784  # D3DDevice_SetPixelShader 0x4A5CE8 stores the handle
CDevice_VertexShader      = 0x794  # the device init 0x4A261B stores the FVF shader object 0x4ADCE8, D3DDevice_SetVertexShader 0x49EEAE the current one
CDevice_BackBufferScale   = 0x96C  # the frame buffer init 0x4A1D4B stores the X scale as a float, 0x4A1D64 the Y scale at +4
CDevice_Viewport          = 0xEE0  # D3DDevice_SetViewport 0x49B040 to 0x49B06C stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xEF8  # D3DDevice_SetScreenSpaceOffset 0x49B943 stores x + 0.53125, 0x49B953 y + 0.53125 at +4
CDevice_AutoDepth         = 0x1A20 # the frame buffer init 0x4A2133 stores the depth buffer, D3D_InitDefaultState 0x4A1AD7 reads it
CDevice_VBlankCallback    = 0x1DB8 # the vertical blank handler 0x4A306E calls [miniport + 0x190], the miniport is at +0x1C28 (0x4A2287); Black 0x0C0FA5 stores it
CDevice_VBlankEvent       = 0x1DBC # D3DDevice_BlockUntilVerticalBlank 0x49A627 waits on it, 0x49A61B clears its SignalState
CDevice_DisplayFlags      = 0x1DDC # D3D_GetAdapterDisplayMode 0x49D633 reads it, the mode set 0x4A2C05 stores the mode entry at miniport + 0x1B4
CDevice_VBlankCount       = 0x1DE8 # the vertical blank handler 0x4A2FD1 increments miniport + 0x1C0; 0x49C37C reads it
CDevice_Field             = 0x1DF8 # the vertical blank handler 0x4A3034 stores the field at miniport + 0x1D0; Black D3DDevice_GetDisplayFieldStatus 0x26B62F reads it
CDevice_GammaRamps        = 0x1E04 # D3DDevice_SetGammaRamp 0x49A413 copies to miniport + 0x1DC + index * 0x300; Black 0x176476
CDevice_GammaPending      = 0x2404 # D3DDevice_SetGammaRamp 0x49A441 sets [miniport + 0x7DC + index * 4]; Black 0x17648F
CDevice_MultiSampleType   = 0x196C # Forza Motorsport: the frame buffer init 0x3C08AB stores the present parameters' MultiSampleType (0x11 for none), D3DDevice_SetBackBufferScale 0x3BCD48 multiplies by its sample counts
CDevice_FrameBufferCount  = 0x1A10 # Forza Motorsport: the frame buffer init 0x3C0859 stores BackBufferCount + 1, then 0x3C0923 the buffers from CDevice_BackBuffer on; Swap's copy 0x3BC930 tests it against 3
CDevice_SwapEffect        = 0x1970 # Forza Motorsport: the frame buffer init 0x3C0849 stores the present parameters' SwapEffect; D3DDevice_SetBackBufferScale 0x3BCD89 leaves the Swap filter flag alone for 3 (D3DSWAPEFFECT_COPY)
CDevice_GridSize          = 0x954  # Forza Motorsport: the surface update 0x3B8615 stores the width the target is drawn at on the GPU's grid, 0x3B861B the height at +4; D3DDevice_SetViewport 0x3B9B58 and D3DDevice_SetScissors 0x3BA197 clamp to them
CDevice_SuperSampleMin    = 0x964  # Forza Motorsport: the surface update 0x3B866E stores the smaller of CDevice_SuperSampleX and Y, D3DDevice_SetRenderState_LineWidth 0x3B7A35 scales by it
CDevice_SuperSampleLog2   = 0x968  # Forza Motorsport: the surface update 0x3B8689 stores the log2 of CDevice_SuperSampleMin, looked up in a table (0x3C65C4)
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x49B147 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x49FA4B: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x49E9FA indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x49EA42 stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x49EA48 stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_CreatePixelShader 0x4A5C84 stores the definition pointer, D3DDevice_SetPixelShader 0x4A5D50 reads it; Black 0x26BD88
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor 0x4D0050 stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor 0x4D0049 stores the second vtable
EffectsImage_Skip0    = 0x804   # 0x4D1DA8 (reached from CDirectSound_DownloadEffectsImage 0x4CDB81) adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x4D1DA2 loads this dword count
EffectsImage_Desc     = 0x818   # 0x4D1DB1: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices 0x4EDAA0 returns it
XPP_Changed           = 0x4     # XGetDevices 0x4EDAA2 clears it, XGetDeviceChanges 0x4EDAC0 tests it
XPP_Previous          = 0x8     # XGetDevices 0x4EDAA8 copies Current into it
