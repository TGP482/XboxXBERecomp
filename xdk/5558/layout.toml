# XDK 5558 library data layouts the runtime reads or writes. Each value is proven by this
# title's default.xbe (The Sims: Bustin' Out, USA) code at the 5558 address given, read from
# out/game.exe (xbe2pe.py flat PE, guest addresses 1:1) after xbe_symbols named the D3D
# functions by .XTLID and constants. Every offset below matched the 5849 value it was checked
# against except where a line says UNPROVEN: there the 5849 value is kept and flagged, not
# silently copied. Device below is the static device D3D__pDevice (0x264948) points at
# (D3D_Device 0x264950 in config/game.toml).
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x2471C0 writes push commands through [device], D3DDevice_SetIndices 0x247430 likewise
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x2471C0 compares the push pointer [device] with [device + 4] and calls MakeSpace
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x247430 stores BaseVertexIndex (a2) at [device + 28]
CDevice_IndexBuffer   = 0x7A0   # D3DDevice_SetIndices 0x247430 releases [device + 1952], stores the new index buffer there
CDevice_ZScale        = 0x948   # the viewport push helper 0x24A700 multiplies viewport MinZ/MaxZ ([device + 0xEF0..]) by the float [device + 2376]
CDevice_SuperSampleX  = 0x95C   # D3DDevice_SetViewport 0x246B40 scales viewport width by the float [device + 2396]
CDevice_SuperSampleY  = 0x960   # D3DDevice_SetViewport 0x246B40 scales viewport height by the float [device + 2400]
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform 0x244FF6: lea edi, [device + type * 64 + 0xC60], copies 16 dwords there
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture 0x2471D0 reads, 0x247209 stores [device + stage * 4 + 0xF88]
CDevice_Palettes      = 0xF98   # D3DDevice_SetPalette 0x2473A0 (unnamed by the scan, found beside SetTexture) reads/stores [device + stage * 4 + 3992] at 0x2473AD
CDevice_RenderTarget  = 0x1A04  # D3DDevice_SetRenderTarget 0x246040 stores the target at [device + 6660], first read at 0x246057
CDevice_Depth         = 0x1A08  # D3DDevice_SetRenderTarget 0x246040 stores the depth surface at [device + 6664]; the getter at 0x246B20 returns [device + 6664] (0x246B26)
CDevice_BackBuffer    = 0x1A14  # GetBackBuffer2 0x2463E0 returns [device + 6676] for index 0 (0x246410)
CDevice_FrontBuffer   = 0x1A18  # GetBackBuffer2 0x2463E0 returns [device + 6680] for index -1 (0x2463F5)
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap 0x249650: inc dword ptr [device + 2478h], returns it at 0x2496CB
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice 0x2443C0 clears the device with memset(device, 0, 0x24A0) on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x2443C0 ors BehaviorFlags & 0x10 into [device + 8] (0x264958); CDevice_KickOff 0x24D120 tests bits of [device + 8]
CDevice_Time              = 0x2C   # CDevice_KickOff 0x24D120 computes [device + 44] - 2 and stores it through the fence pointer [device + 48]
CDevice_PixelShader       = 0x784  # D3DDevice_SetPixelShader 0x24E740 stores the handle at [device + 1924]
CDevice_VertexShader      = 0x794  # D3DDevice_SetVertexShader 0x24C3F0 stores the shader object at [device + 1940], the handle at +1944
CDevice_BackBufferScale   = 0x96C  # the scale getter 0x248C30 returns [device + 2412] as X (0x248C35) and [device + 2416] as Y; 0x245CC0 scales by both
CDevice_Viewport          = 0xEE0  # D3DDevice_SetViewport stores X at 0x246CF0 ([device + 0xEE0]), Y/Width/Height/MinZ/MaxZ at +4..+20
CDevice_ScreenSpaceOffset = 0xEF8  # SetScreenSpaceOffset 0x2480F0 stores x + 0.53125 at [device + 3832] (0x248103), y at +3836
CDevice_AutoDepth         = 0x1A20 # D3D_InitDefaultState 0x24F997: mov esi, [device + 1A20h], passes it as render state 143
CDevice_VBlankCallback    = 0x1DB8 # the callback setter 0x245450 stores its argument at [device + 7608] (0x24545A)
CDevice_VBlankEvent       = 0x1DBC # BlockUntilVerticalBlank 0x245490 waits on device + 7612 and clears [device + 7616] first (0x24549B)
CDevice_DisplayFlags      = 0x1DDC # the display-field query 0x247630 tests [device + 7644] & 0x1200000 (0x247642)
CDevice_VBlankCount       = 0x1DE8 # the display-field query 0x247630 returns [device + 7656] as the count (0x247635)
CDevice_Field             = 0x1DF8 # the display-field query 0x247630 derives the field from [device + 7672] == 0 (0x24764F)
CDevice_GammaRamps        = 0x1E04 # D3DDevice_SetGammaRamp 0x244EC0 copies to miniport ([device + 0x1C28]) + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2404 # D3DDevice_SetGammaRamp 0x244EC0 sets [miniport + 0x7DC + index * 4]
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x247247: or eax, 4800h into D3D_DirtyFlags (0x2644A8)
TextureState_Stage    = 32      # SetTextureStageStateNotInline 0x24A5A0: dword_2644B0[stage * 32 + type] = value
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x24BE90 indexes the stream table (0x266DF0) by stream * 3 dwords
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x24BE90 stores Stride at table + stream * 12 + 0
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x24BE90 stores the vertex buffer at table + stream * 12 + 8 (array at 0x266DF8)
PixelShader_Definition = 0x8  # D3DDevice_SetPixelShader 0x24E740 reads the definition pointer at [shader + 8] throughout
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor 0x29048D stores the first vtable at [stream + 0]
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor 0x29048D stores the second vtable at [stream + 4]
EffectsImage_Skip0    = 0x804   # the effects-image walker 0x294000 reads the dword count image[513] ([image + 0x804], 0x294013)
EffectsImage_Skip1    = 0x80C   # the effects-image walker 0x294000 reads the dword count image[515] ([image + 0x80C], 0x294019)
EffectsImage_Desc     = 0x818   # 0x294000: descriptor at image + 0x818 + (Skip0 + Skip1) * 4 (0x294022)
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices (unnamed, body at 0x2DB063, called from game code at 0x1269F2 with &0x2D9D10) returns [edx] at 0x2DB06E
XPP_Changed           = 0x4     # the same body clears [edx+4] at 0x2DB070; XGetDeviceChanges 0x2DB085 tests it at 0x2DB08E and clears it at 0x2DB0CF
XPP_Previous          = 0x8     # the same body stores the current set into [edx+8] at 0x2DB076; XGetDeviceChanges diffs [esi] against [esi+8] and re-copies at 0x2DB0D3
